name: Project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'
    env:
      PYTHONUTF8: '1'
      YOLO_CONFIG_DIR: ${{ github.workspace }}/.cache/ultralytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python validate_results.py
      - run: python predict.py --image detection/results/prediction_gallery/base.jpg --output outputs/ci_prediction.json
